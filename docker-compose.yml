name: aura

services:
  intelligence:
    build:
      context: ./intelligence
    container_name: aura-intelligence
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    volumes:
      - aura-model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - aura-network

  web:
    build:
      context: ./web
    container_name: aura-web
    restart: unless-stopped
    depends_on:
      intelligence:
        condition: service_healthy
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      AURA_INTELLIGENCE_URL: http://intelligence:8000
      AURA_AIML_URL: http://intelligence:8000
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:-aura_default_secret_32_chars_long_key_demo}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-${AUTH_SECRET:-aura_default_secret_32_chars_long_key_demo}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@aura.ai}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/aura.db}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - aura-web-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 35s
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge

volumes:
  aura-model-cache:
  aura-web-data:
services:
  aiml:
    build:
      context: ./aiml
    container_name: aura-aiml
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - aura-model-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  aura:
    build:
      context: ./AURA.ai
    container_name: aura-web
    restart: unless-stopped
    depends_on:
      aiml:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      AURA_AIML_URL: http://aiml:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET before starting}
      DATABASE_URL: ${DATABASE_URL:-}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}

volumes:
  aura-model-cache:
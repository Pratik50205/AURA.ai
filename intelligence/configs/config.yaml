# AURA AI/ML Configuration
# All paths are relative to project root

project:
  name: "aura-ai-ml"
  version: "0.1.0"
  seed: 42

# --- Data Paths ---
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  train_dir: "data/train"
  validation_dir: "data/validation"
  test_dir: "data/test"
  tools_file: "data/processed/aura_tools.json"
  queries_file: "data/processed/aura_queries.json"
  qrels_file: "data/processed/aura_qrels.json"
  pairs_file: "data/processed/aura_pairs.json"
  split_ratio:
    train: 0.70
    validation: 0.15
    test: 0.15

# --- Embedding Models (CPU-optimized) ---
embedding:
  primary_model: "sentence-transformers/all-MiniLM-L6-v2"
  baseline_model: "sentence-transformers/multi-qa-mpnet-base-cos-v1"
  advanced_model: "BAAI/bge-m3"
  # Use primary_model for CPU; switch to advanced_model if GPU available
  active_model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32
  max_seq_length: 512
  normalize_embeddings: true
  cache_dir: "models/embeddings"

# --- FAISS Index ---
faiss:
  index_dir: "data/indexes"
  index_type: "FlatIP"  # FlatIP for inner product (cosine with normalized vectors)
  nprobe: 10

# --- Retrieval ---
retrieval:
  top_n_candidates: 20
  top_k_results: 5
  similarity_metric: "cosine"

# --- Ranking ---
ranking:
  mlp:
    hidden_dims: [128, 64]
    dropout: 0.3
    learning_rate: 0.001
    epochs: 50
    batch_size: 64
    patience: 5  # early stopping
  reranker:
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    device: "cpu"
    batch_size: 16

# --- BM25 Baseline ---
bm25:
  k1: 1.5
  b: 0.75

# --- Evaluation ---
evaluation:
  k_values: [1, 3, 5, 10]
  metrics:
    - "precision"
    - "recall"
    - "mrr"
    - "ndcg"
    - "hit_rate"

# --- Inference ---
inference:
  default_top_k: 5
  host: "0.0.0.0"
  port: 8000

# --- Semantic Document Template ---
semantic_template:
  version: "v1"
  fields:
    - "name"
    - "category"
    - "description"
    - "tags"
    - "keyFeatures"
    - "useCases"

# --- Logging ---
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
